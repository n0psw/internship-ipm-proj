databases:
  - name: internship-db
    databaseName: internship_tracker
    user: internship_user
    plan: free

services:
  # ── FastAPI Backend ────────────────────────────────────────
  - type: web
    name: internship-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: internship-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a random secret
      - key: CORS_ORIGINS
        value: https://internship-tracker-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── React Frontend ─────────────────────────────────────────
  - type: web
    name: internship-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://internship-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
